# Builds installable copies of the package on every tag and attaches them to
# the release.
#
# Staff who cannot reach GitHub from R install from these instead: download the
# .zip and run install.packages("path/to/islandbrand_x.y.z.zip", repos = NULL).

# Tag-driven only. A manual run has no tag to attach assets to, so the
# release step would have nowhere to put them.
on:
  push:
    tags: ['v*']

name: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, artifact: zip}
          - {os: ubuntu-latest,  artifact: tar.gz}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with DESCRIPTION produces a release whose assets
      # are named for a different version than the tag says. Catch it here
      # rather than after staff have downloaded it.
      - name: Check the tag matches DESCRIPTION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          described=$(grep '^Version:' DESCRIPTION | sed 's/Version: *//')
          if [ "$tag" != "$described" ]; then
            echo "Tag v$tag does not match DESCRIPTION version $described." >&2
            exit 1
          fi
          echo "Tag and DESCRIPTION agree on $described."
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Build the source package on both runners. R CMD build knits the
      # vignettes into inst/doc; installing straight from the checkout would
      # leave the Windows binary without them.
      - name: Build source package
        run: R CMD build .
        shell: bash

      # A Windows binary is what a locked-down laptop can install without a
      # compiler and without reaching CRAN.
      - name: Build Windows binary
        if: matrix.config.artifact == 'zip'
        run: R CMD INSTALL --build islandbrand_*.tar.gz
        shell: bash

      # Each runner uploads only its own kind of file, so the two jobs never
      # attach the same file name to the release.
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.${{ matrix.config.artifact }}'
          fail_on_unmatched_files: true
