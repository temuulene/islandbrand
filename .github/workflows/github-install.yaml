name: GitHub installation without Rtools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4.1', 'release']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: 'none'
      - name: Install directly from public GitHub without compiler tools
        run: Rscript data-raw/check-github-install.R temuulene/islandbrand
        shell: bash
      - name: Upgrade an outdated dependency and exercise the candidate without compiler tools
        run: Rscript data-raw/check-github-install.R temuulene/islandbrand .
        shell: bash
