# Checks the oldest versions DESCRIPTION promises, so the declared range is
# tested rather than assumed. Each run tests one floor:
#
# * hard: the oldest R (4.1) with ggplot2 at its declared minimum and only the
#   hard dependencies. Optional packages are not installed; their tests skip.
# * optional: the approved staff R (4.4.1) with every package, and flextable
#   and gtsummary at their declared minimums.
#
# A step checks that every pinned package is installed at its pinned version
# and loads, so a failed pin fails the job rather than skipping tests.
name: Minimum declared dependencies
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    name: R ${{ matrix.config.r }} (${{ matrix.config.deps }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: '4.1', deps: hard}
          - {os: ubuntu-latest, r: '4.4.1', deps: optional}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FLOOR: ${{ matrix.config.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          # Deciding whether pandoc is needed resolves every Suggested
          # package, and gtsummary needs R 4.2, so on R 4.1 the step fails
          # before anything is installed. The hard floor needs no pandoc.
          install-pandoc: ${{ matrix.config.deps == 'hard' && 'false' || 'auto' }}
          extra-packages: |
            any::remotes
            any::testthat
            any::withr
            any::pkgload
      - name: Pin declared minimum versions
        shell: Rscript {0}
        run: |
          pin <- function(package, version) {
            remotes::install_version(
              package,
              version = version,
              upgrade = "never",
              dependencies = FALSE
            )
          }
          if (Sys.getenv("FLOOR") == "hard") {
            pin("ggplot2", "3.5.0")
          } else {
            pin("flextable", "0.9.10")
            pin("gtsummary", "2.0.3")
          }
      - name: Confirm the pinned versions are installed and load
        shell: Rscript {0}
        run: |
          pins <- if (Sys.getenv("FLOOR") == "hard") {
            c(ggplot2 = "3.5.0")
          } else {
            c(flextable = "0.9.10", gtsummary = "2.0.3")
          }
          print(R.version.string)
          for (package in names(pins)) {
            installed <- tryCatch(
              as.character(packageVersion(package)),
              error = function(e) "not installed"
            )
            loads <- tryCatch(
              {
                loadNamespace(package)
                "loads"
              },
              error = function(e) conditionMessage(e)
            )
            cat(package, installed, loads, "\n")
            if (installed != pins[[package]] || loads != "loads") {
              stop(package, " is not usable at its declared minimum ", pins[[package]])
            }
          }
      - name: Test at minimum versions
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
