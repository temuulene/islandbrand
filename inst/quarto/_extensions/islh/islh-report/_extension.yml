title: Island Health Report
author: Island Health
version: 0.1.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    common:
      lang: en-CA
      brand: _brand.yml
      fig-cap-location: bottom
      tbl-cap-location: top
      fig-align: left
      execute:
        echo: false
        warning: false
        message: false
    html:
      toc: true
      toc-depth: 3
      embed-resources: true
      # BC Sans is licensed by the BC government and not embedded, so it has
      # to degrade to a sans-serif. Without a stack the browser falls back to
      # a serif and the page stops looking like Island Health.
      mainfont: '"BC Sans", "Noto Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif'
      theme: [default, islh.scss]
      code-copy: false
    docx:
      reference-doc: islh-report-reference.docx
      # A caption below a knitr figure can be orphaned by a Word page break.
      # Putting it first keeps the caption and figure together.
      fig-cap-location: top
      toc: true
      toc-depth: 2
      number-sections: false
