<title id="title">islandbrand logo: faceted peaks</title>
<desc id="desc">Hex sticker for islandbrand: five low-poly mountains, each split into a dark and a light facet from a different Island Health colour family, under an orange sun on a pale blue sky. A navy sea carries the package name.</desc>
